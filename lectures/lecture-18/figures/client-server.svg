<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B3A6B"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E63946"/>
    </marker>
  </defs>
  <!-- role labels -->
  <text x="110" y="22" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="2" fill="#8A97AB">CLIENT</text>
  <text x="410" y="22" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="2" fill="#8A97AB">SERVER</text>
  <!-- actors -->
  <rect x="20" y="34" width="180" height="56" rx="10" fill="#1B3A6B"/>
  <text x="110" y="69" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">Your laptop</text>
  <rect x="310" y="34" width="200" height="56" rx="10" fill="#1B3A6B"/>
  <text x="410" y="69" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">api.worldbank.org</text>
  <!-- lifelines -->
  <line x1="110" y1="90" x2="110" y2="395" stroke="#1B3A6B" stroke-width="2" stroke-dasharray="2 5" opacity="0.5"/>
  <line x1="410" y1="90" x2="410" y2="395" stroke="#1B3A6B" stroke-width="2" stroke-dasharray="2 5" opacity="0.5"/>
  <!-- 1 request -->
  <text x="260" y="135" text-anchor="middle" font-size="18" fill="#1B3A6B" font-family="Menlo, Consolas, monospace">GET /v2/country/BRA/...</text>
  <line x1="112" y1="150" x2="406" y2="150" stroke="#1B3A6B" stroke-width="3" marker-end="url(#arr)"/>
  <!-- 2 server work -->
  <rect x="320" y="180" width="180" height="50" rx="8" fill="#F5F7FA" stroke="#1B3A6B" stroke-width="2"/>
  <text x="410" y="212" text-anchor="middle" font-size="18" font-weight="700" fill="#1B3A6B">looks up data</text>
  <!-- 3 response -->
  <text x="260" y="278" text-anchor="middle" font-size="18" fill="#1B3A6B" font-family="Menlo, Consolas, monospace">200 OK + JSON</text>
  <line x1="408" y1="293" x2="114" y2="293" stroke="#E63946" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arr-red)"/>
  <!-- 4 client work -->
  <rect x="15" y="325" width="190" height="50" rx="8" fill="#F5F7FA" stroke="#1B3A6B" stroke-width="2"/>
  <text x="110" y="357" text-anchor="middle" font-size="18" font-weight="700" fill="#1B3A6B">parse and analyse</text>
</svg>
